<!DOCTYPE html>
<html>
<head>
    <title>BATOOR KHAN | 3D VIZ</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; }
        .hud { position: absolute; top: 20px; left: 20px; color: #00f2ff; border-left: 2px solid #00f2ff; padding-left: 15px; pointer-events: none; }
    </style>
</head>
<body>

<div class="hud">
    <strong>COMMANDER: BATOOR KHAN</strong><br>
    STATUS: ORBITAL 3D RENDER ACTIVE<br>
    <span id="coords">WAITING FOR SAT...</span>
</div>

<div id="canvas-container"></div>

<script src="https://cloudflare.com"></script>

<script>
    // 1. Setup Scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. Create Earth (A simple sphere)
    const geometry = new THREE.SphereGeometry(5, 32, 32);
    const material = new THREE.MeshPhongMaterial({ 
        color: 0x2233ff, 
        wireframe: true // Makes it look like a "Hacker" grid
    });
    const earth = new THREE.Mesh(geometry, material);
    scene.add(earth);

    // 3. Add Light
    const light = new THREE.PointLight(0xffffff, 1, 100);
    light.position.set(10, 10, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x333333));

    // 4. Create ISS Marker (Small red glowing cube)
    const issGeom = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    const issMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const iss = new THREE.Mesh(issGeom, issMat);
    scene.add(iss);

    camera.position.z = 15;

    // 5. Track ISS
    async function track() {
        try {
            const res = await fetch('https://wheretheiss.at');
            const data = await res.json();
            
            // Convert Lat/Lon to 3D Coordinates
            const lat = data.latitude * (Math.PI / 180);
            const lon = -data.longitude * (Math.PI / 180);
            const radius = 5.5; // Slightly above Earth surface

            iss.position.x = radius * Math.cos(lat) * Math.cos(lon);
            iss.position.y = radius * Math.sin(lat);
            iss.position.z = radius * Math.cos(lat) * Math.sin(lon);

            document.getElementById('coords').innerText = `LAT: ${data.latitude.toFixed(2)} LON: ${data.longitude.toFixed(2)}`;
        } catch (e) { console.log("Link down..."); }
    }

    function animate() {
        requestAnimationFrame(animate);
        earth.rotation.y += 0.001; // Earth slowly spins
        renderer.render(scene, camera);
    }

    setInterval(track, 3000);
    animate();
    track();
</script>
</body>
</html>
