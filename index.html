<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BK-AI | Cryo Nexus</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500&display=swap');

        :root {
            --ice: #00f2ff;
            --electric: #7000ff;
            --deep: #020205;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--deep);
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh; overflow: hidden;
        }

        #canvas-container { position: fixed; top: 0; left: 0; z-index: -1; }

        /* --- INTRO OVERLAY --- */
        #intro-overlay {
            position: fixed; inset: 0;
            background: var(--deep);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100; transition: 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .start-btn {
            padding: 20px 40px;
            font-family: 'Orbitron', sans-serif;
            background: transparent;
            border: 2px solid var(--ice);
            color: var(--ice);
            letter-spacing: 5px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.5s;
        }

        .start-btn:hover {
            background: var(--ice);
            color: black;
            box-shadow: 0 0 50px var(--ice);
        }

        /* --- PROCESSOR ANIMATION --- */
        #processor-sequence {
            position: fixed; inset: 0;
            background: black;
            display: none;
            align-items: center; justify-content: center;
            z-index: 90;
            transition: 0.8s;
        }

        .chip {
            width: 180px; height: 180px;
            border: 2px solid #222;
            background: linear-gradient(145deg, #111, #000);
            position: relative;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
        }

        .circuit-line {
            position: absolute;
            background: var(--ice);
            box-shadow: 0 0 8px var(--ice);
            transition: 0.4s ease-out;
        }

        /* --- MAIN UI --- */
        #main-ui {
            opacity: 0; display: flex; flex-direction: column;
            height: 100vh; padding: 20px;
            transition: 1.5s ease-in-out;
            pointer-events: none;
        }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
        }

        .ice-msg {
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.08), rgba(112, 0, 255, 0.03));
            border-left: 2px solid var(--ice);
            animation: iceReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes iceReveal {
            from { clip-path: inset(0 100% 0 0); transform: translateX(-10px); opacity: 0; }
            to { clip-path: inset(0 0 0 0); transform: translateX(0); opacity: 1; }
        }

        /* Scrollbar */
        #chat-window::-webkit-scrollbar { width: 3px; }
        #chat-window::-webkit-scrollbar-thumb { background: var(--ice); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Intro Screen -->
    <div id="intro-overlay">
        <h1 class="text-3xl font-bold mb-12 tracking-[1rem] font-['Orbitron'] text-white">NEXUS CORE</h1>
        <button class="start-btn" onclick="startSequence()">BOOT SYSTEM</button>
    </div>

    <!-- Samsung-Style Processor Sequence -->
    <div id="processor-sequence">
        <div class="chip">
            <div class="text-[12px] font-['Orbitron'] text-cyan-400 opacity-80">BK-ULTRA</div>
        </div>
    </div>

    <!-- Main Chat UI -->
    <div id="main-ui">
        <header class="flex justify-between items-center mb-8 px-4">
            <div>
                <div class="font-['Orbitron'] text-ice text-xl tracking-widest">BK-AI <span class="text-white opacity-30 text-xs">OS v4</span></div>
                <div class="text-[9px] text-purple-400 uppercase tracking-widest">Neural Engineering Link</div>
            </div>
            <div class="text-[10px] text-white opacity-40 font-['Orbitron']">AUTHORIZED: BATOOR KHAN</div>
        </header>

        <div id="chat-window" class="flex-1 overflow-y-auto space-y-6 p-6 mb-6">
            <div class="ice-msg p-5 max-w-[85%] rounded-r-2xl text-sm leading-relaxed">
                <span class="text-cyan-400 text-[10px] block mb-1 font-bold">SYSTEM STATUS: READY</span>
                Neural connection established. All engineering sub-systems are online. How shall we proceed, Batoor Khan?
            </div>
        </div>

        <div class="glass p-3 flex items-center gap-4 border-t border-white/10">
            <input type="text" id="userInput" 
                   class="bg-transparent flex-1 p-4 outline-none text-white text-sm placeholder:text-gray-600" 
                   placeholder="Enter Neural Command..."
                   onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-cyan-500 text-black px-10 py-3 rounded-xl font-bold text-xs tracking-widest hover:bg-white transition-all duration-300">EXECUTE</button>
        </div>
    </div>

    <script type="importmap">
    { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // --- 3D ENVIRONMENT ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const starGeo = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i++) starPos[i] = (Math.random() - 0.5) * 15;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ size: 0.007, color: 0x00f2ff, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);
        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0002;
            renderer.render(scene, camera);
        }
        animate();

        // --- STARTUP SEQUENCE ---
        window.startSequence = () => {
            const intro = document.getElementById('intro-overlay');
            const proc = document.getElementById('processor-sequence');
            const main = document.getElementById('main-ui');
            const chip = document.querySelector('.chip');

            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                proc.style.display = 'flex';
                
                // Electricity Traveling Lines Animation
                for(let i=0; i<24; i++) {
                    setTimeout(() => {
                        const line = document.createElement('div');
                        line.className = 'circuit-line';
                        const dir = Math.floor(Math.random()*4);
                        if(dir === 0) { line.style.width="2px"; line.style.height="60px"; line.style.bottom="100%"; line.style.left=Math.random()*180+"px"; }
                        else if(dir === 1) { line.style.width="60px"; line.style.height="2px"; line.style.left="100%"; line.style.top=Math.random()*180+"px"; }
                        else if(dir === 2) { line.style.width="2px"; line.style.height="60px"; line.style.top="100%"; line.style.left=Math.random()*180+"px"; }
                        else { line.style.width="60px"; line.style.height="2px"; line.style.right="100%"; line.style.top=Math.random()*180+"px"; }
                        chip.appendChild(line);
                    }, i * 80);
                }

                setTimeout(() => {
                    proc.style.opacity = '0';
                    setTimeout(() => {
                        proc.style.display = 'none';
                        main.style.opacity = '1';
                        main.style.pointerEvents = 'auto';
                    }, 8000);
                }, 3000);
            }, 1000);
        };

        // --- GEMINI AI CORE ---
        const API_KEY = "AIzaSyAIbiAN-sFkYRdHHxb-7L4LmawMUYB0ook"; 
        const genAI = new GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ 
            model: "gemini-1.5-flash",
            systemInstruction: "You are BK-AI, a high-level engineering mind created for Batoor Khan. You are a specialist in robotics, software engineering, and electronics. Respond with precision, authority, and a touch of cyberpunk wit. Keep answers concise."
        });
        const chat = model.startChat({ history: [] });

        window.sendMessage = async () => {
            const input = document.getElementById('userInput');
            const win = document.getElementById('chat-window');
            if(!input.value.trim()) return;

            const val = input.value;
            input.value = '';
            
            // User Message UI
            win.innerHTML += `<div class="p-4 self-end bg-white/5 border border-white/10 rounded-2xl ml-auto max-w-[80%] text-sm text-gray-300">${val}</div>`;
            win.scrollTop = win.scrollHeight;

            try {
                const result = await chat.sendMessage(val);
                const response = await result.response;
                // AI Response UI
                win.innerHTML += `<div class="ice-msg p-5 max-w-[85%] rounded-r-2xl text-sm leading-relaxed">${response.text()}</div>`;
            } catch (e) {
                win.innerHTML += `<div class="text-red-400 text-[10px] uppercase tracking-widest p-4">Nexus Error: Connection Interrupted</div>`;
            }
            win.scrollTop = win.scrollHeight;
        };
    </script>
</body>
</html>
