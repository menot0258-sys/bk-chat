<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BK CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap');
        :root { --glass: rgba(8, 10, 15, 0.98); --batoor: linear-gradient(135deg, #ff9d00, #ff0055); }
        body { font-family: 'Outfit', sans-serif; background: #010203; color: #fff; height: 100vh; overflow: hidden; }
        .glass-panel { background: var(--glass); backdrop-filter: blur(50px); border: 1px solid rgba(255,255,255,0.08); }
        .batoor-text { background: var(--batoor); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        .nav-btn { opacity: 0.3; transition: 0.3s; font-weight: 900; font-size: 11px; text-transform: uppercase; }
        .nav-btn.active { opacity: 1; color: #3b82f6; filter: drop-shadow(0 0 8px #3b82f6); }
        .msg { max-width: 80%; margin-bottom: 8px; padding: 12px; border-radius: 20px; position: relative; }
        .msg.me { background: #3b82f6; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.them { background: #1f2937; align-self: flex-start; border-bottom-left-radius: 4px; }
        .thumb { width: 100%; max-height: 200px; object-fit: contain; border-radius: 12px; margin-top: 8px; background: #000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .reply-box { font-size: 10px; border-left: 2px solid #fff; padding-left: 8px; opacity: 0.7; margin-bottom: 4px; }
    </style>
</head>
<body onload="checkPersistence()">

    <div id="lightbox" onclick="this.style.display='none'" class="fixed inset-0 z-[10000] bg-black/90 hidden items-center justify-center p-4">
        <img id="full-img" class="max-w-full max-h-full object-contain">
    </div>

    <div id="auth-screen" class="fixed inset-0 z-[9999] bg-[#010203] flex flex-col items-center justify-center p-8">
        <h1 class="text-7xl font-black mb-12 italic">BK CHAT<span class="text-blue-500">.</span></h1>
        <input id="login-user" type="text" placeholder="ID" class="w-full max-w-sm p-6 glass-panel rounded-[30px] text-center outline-none mb-4">
        <input id="login-pass" type="password" placeholder="KEY" class="w-full max-w-sm p-6 glass-panel rounded-[30px] text-center outline-none mb-6">
        <button onclick="handleLogin()" class="w-full max-w-sm bg-blue-600 py-6 rounded-[30px] font-black uppercase">Enter</button>
    </div>

    <div id="app-ui" class="hidden flex flex-col h-screen">
        <header class="p-8 pb-4 flex justify-between items-center border-b border-white/5">
            <div onclick="location.reload()" class="font-black text-3xl italic cursor-pointer">BK CHAT</div>
            <div id="aura-top" class="glass-panel px-5 py-2 rounded-2xl text-[10px] font-black uppercase">SYNC...</div>
        </header>

        <main class="flex-1 relative overflow-hidden">
            <div id="view-sq" class="absolute inset-0 overflow-y-auto no-scrollbar pb-40 px-6 pt-6">
                <div id="sq-feed" class="space-y-4"></div>
                <div class="fixed bottom-28 left-6 right-6 flex gap-2">
                    <input id="sq-input" type="text" placeholder="Post to Square..." class="flex-1 p-4 glass-panel rounded-2xl outline-none text-sm">
                    <button onclick="document.getElementById('img-sq').click()" class="p-4 glass-panel rounded-2xl">📷</button>
                    <button onclick="postSquare()" class="bg-blue-600 px-6 rounded-2xl font-bold uppercase text-xs">Post</button>
                    <input type="file" id="img-sq" class="hidden" accept="image/*">
                </div>
            </div>

            <div id="view-ch" class="hidden absolute inset-0 overflow-y-auto no-scrollbar p-6">
                <div class="flex gap-2 mb-6">
                    <input id="friend-search" type="text" placeholder="User ID..." class="flex-1 p-4 glass-panel rounded-2xl outline-none">
                    <button onclick="addFriend()" class="px-6 bg-blue-600 rounded-2xl font-black">+</button>
                </div>
                <div id="chat-list" class="space-y-3"></div>
            </div>

            <div id="view-dm" class="hidden absolute inset-0 flex flex-col bg-[#010203] z-[100]">
                <div class="p-4 glass-panel flex items-center gap-4">
                    <button onclick="nav('ch')" class="text-xl">←</button>
                    <div id="dm-target-name" class="font-black uppercase text-sm">Chat</div>
                </div>
                <div id="dm-messages" class="flex-1 overflow-y-auto p-4 flex flex-col no-scrollbar"></div>
                <div id="reply-preview" class="hidden px-4 py-2 bg-blue-900/30 text-[10px] flex justify-between items-center">
                    <span id="reply-text">Replying...</span>
                    <button onclick="cancelReply()">✕</button>
                </div>
                <div class="p-4 flex gap-2">
                    <input id="dm-input" type="text" placeholder="Message..." class="flex-1 p-4 glass-panel rounded-2xl outline-none text-sm">
                    <button onclick="document.getElementById('img-dm').click()" class="p-4 glass-panel rounded-2xl">📷</button>
                    <button onclick="sendDM()" class="bg-blue-600 px-6 rounded-2xl font-black uppercase text-xs">Send</button>
                    <input type="file" id="img-dm" class="hidden" accept="image/*">
                </div>
            </div>

            <div id="view-ld" class="hidden absolute inset-0 overflow-y-auto no-scrollbar p-6 pt-6">
                <div id="leaderboard-list" class="space-y-3"></div>
            </div>
        </main>

        <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 flex glass-panel p-2 rounded-[35px] gap-2 z-[90]">
            <button onclick="nav('sq')" id="nav-sq" class="nav-btn active px-6 py-3">Feed</button>
            <button onclick="nav('ch')" id="nav-ch" class="nav-btn px-6 py-3">Friends</button>
            <button onclick="nav('ld')" id="nav-ld" class="nav-btn px-6 py-3">Ranks</button>
        </nav>
    </div>

    <script>
        const config = { apiKey: "AIzaSyA6jP9_1n97bKi6Eo2qtLVDf1U4xH_p8TQ", databaseURL: "https://i-am-here-44a35-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config); const rdb = firebase.database();
        let me = ""; let activeChat = ""; let replyID = "";

        function checkPersistence() {
            const saved = localStorage.getItem('bk_login');
            if(saved) { const {u, p} = JSON.parse(saved); handleLogin(u, p); }
        }

        function handleLogin(uIn, pIn) {
            const u = uIn || document.getElementById('login-user').value.trim().toLowerCase();
            const p = pIn || document.getElementById('login-pass').value; if(!u || !p) return;
            rdb.ref(`users/${u}`).once('value', snap => {
                if(!snap.exists()) rdb.ref(`users/${u}`).set({ pass: p, aura: 10 });
                else if(snap.val().pass !== p) return alert("Wrong Key");
                me = u; localStorage.setItem('bk_login', JSON.stringify({u, p}));
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-ui').classList.remove('hidden');
                loadData();
            });
        }

        async function postSquare() {
            const txt = document.getElementById('sq-input').value;
            const file = document.getElementById('img-sq').files[0];
            let img = "";
            if(file) { img = await new Promise(r => { const rd = new FileReader(); rd.onload = e => r(e.target.result); rd.readAsDataURL(file); }); }
            if(!txt && !img) return;
            rdb.ref('square').push({ user: me, text: txt, img: img, time: Date.now() });
            document.getElementById('sq-input').value = ""; document.getElementById('img-sq').value = "";
        }

        function deletePost(id) { if(me === 'batoor') rdb.ref(`square/${id}`).remove(); }

        function addFriend() {
            const id = document.getElementById('friend-search').value.trim().toLowerCase();
            if(!id || id === me) return;
            rdb.ref(`users/${id}`).once('value', s => {
                if(s.exists()) rdb.ref(`friends/${me}/${id}`).set(true).then(()=>alert("Added!"));
                else alert("User not found");
            });
        }

        function openChat(id) {
            activeChat = id; document.getElementById('dm-target-name').innerText = `@${id}`; nav('dm');
            const chatID = me < id ? `${me}_${id}` : `${id}_${me}`;
            rdb.ref(`chats/${chatID}`).on('value', snap => {
                const box = document.getElementById('dm-messages'); box.innerHTML = "";
                snap.forEach(m => {
                    const d = m.val(); const isMe = d.sender === me;
                    box.innerHTML += `
                        <div class="msg ${isMe?'me':'them'}" onclick="setReply('${d.text}')" ondblclick="react('${m.key}')">
                            ${d.reply ? `<div class="reply-box">${d.reply}</div>` : ''}
                            <p class="text-sm">${d.text||''}</p>
                            ${d.img ? `<img src="${d.img}" class="thumb" onclick="fullImg('${d.img}')">` : ''}
                            ${d.react ? `<span class="absolute -bottom-2 right-2 text-[10px]">❤️</span>` : ''}
                        </div>`;
                });
                box.scrollTo(0, box.scrollHeight);
            });
        }

        async function sendDM() {
            const txt = document.getElementById('dm-input').value;
            const file = document.getElementById('img-dm').files[0];
            let img = "";
            if(file) { img = await new Promise(r => { const rd = new FileReader(); rd.onload = e => r(e.target.result); rd.readAsDataURL(file); }); }
            if(!txt && !img) return;
            const chatID = me < activeChat ? `${me}_${activeChat}` : `${activeChat}_${me}`;
            rdb.ref(`chats/${chatID}`).push({ sender: me, text: txt, img: img, reply: replyID });
            document.getElementById('dm-input').value = ""; document.getElementById('img-dm').value = ""; cancelReply();
        }

        function setReply(t) { replyID = t; document.getElementById('reply-preview').classList.remove('hidden'); document.getElementById('reply-text').innerText = `Replying: ${t.substring(0,20)}...`; }
        function cancelReply() { replyID = ""; document.getElementById('reply-preview').classList.add('hidden'); }
        function react(key) { const chatID = me < activeChat ? `${me}_${activeChat}` : `${activeChat}_${me}`; rdb.ref(`chats/${chatID}/${key}/react`).set(true); }
        function fullImg(src) { document.getElementById('full-img').src = src; document.getElementById('lightbox').style.display = 'flex'; }

        function loadData() {
            rdb.ref('square').on('value', snap => {
                const f = document.getElementById('sq-feed'); f.innerHTML = "";
                snap.forEach(c => {
                    const d = c.val(); const isB = d.user === 'batoor';
                    f.innerHTML = `
                        <div class="p-5 glass-panel rounded-3xl ${isB?'border-orange-500/50 border-2':''}">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[10px] ${isB?'batoor-text':'text-blue-500'} font-black uppercase">@${d.user}</span>
                                ${me === 'batoor' ? `<button onclick="deletePost('${c.key}')" class="text-[9px] bg-red-500/20 px-2 py-1 rounded">DEL</button>` : ''}
                            </div>
                            <p class="text-sm font-light">${d.text||''}</p>
                            ${d.img ? `<img src="${d.img}" class="thumb" onclick="fullImg('${d.img}')">` : ''}
                        </div>` + f.innerHTML;
                });
            });

            rdb.ref(`friends/${me}`).on('value', snap => {
                const list = document.getElementById('chat-list'); list.innerHTML = "";
                snap.forEach(f => {
                    list.innerHTML += `<div onclick="openChat('${f.key}')" class="p-5 glass-panel rounded-2xl flex justify-between items-center border-l-4 border-blue-600 cursor-pointer">
                        <span class="font-black text-xs uppercase">@${f.key}</span>
                        <span class="text-[9px] bg-blue-500/20 text-blue-500 px-2 py-1 rounded">CHAT</span>
                    </div>`;
                });
            });

            rdb.ref('users').on('value', snap => {
                const list = document.getElementById('leaderboard-list'); list.innerHTML = "";
                const users = snap.val();
                let uArr = []; for(let id in users) { if(id !== 'batoor') uArr.push({id, ...users[id]}); }
                uArr.sort((a,b) => (b.aura||0) - (a.aura||0));

                const topEl = document.getElementById('aura-top');
                if(me === 'batoor') topEl.innerHTML = `<span class="batoor-text">AURA: ∞</span>`;
                else topEl.innerText = `AURA: ${users[me].aura||0}`;

                list.innerHTML = `<div class="p-5 glass-panel rounded-3xl border-2 border-orange-500/40 flex justify-between items-center">
                    <span class="batoor-text text-lg">1. BATOOR</span><span class="text-orange-500 font-black text-xl">∞</span>
                </div>`;
                uArr.forEach((u, i) => {
                    list.innerHTML += `<div class="p-4 glass-panel rounded-2xl flex justify-between items-center ${u.id===me?'border border-blue-500':''}">
                        <span class="font-bold text-xs opacity-70 uppercase">${i+2}. ${u.id}</span>
                        <span class="font-black text-blue-500">${u.aura||0}</span>
                    </div>`;
                });
            });
        }

        function nav(v) {
            ['sq', 'ch', 'ld', 'dm'].forEach(x => { 
                if(document.getElementById('view-'+x)) document.getElementById('view-'+x).classList.add('hidden');
                if(document.getElementById('nav-'+x)) document.getElementById('nav-'+x).classList.remove('active');
            });
            document.getElementById('view-'+v).classList.remove('hidden');
            if(document.getElementById('nav-'+v)) document.getElementById('nav-'+v).classList.add('active');
        }
        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
